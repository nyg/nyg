name: generate-readme

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
          run_install: true

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@8614f3a61601854731381d853f8566867754a5ca # v2.0.0
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&show=discussions_started,discussions_answered,prs_merged
          path: assets/cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@8614f3a61601854731381d853f8566867754a5ca # v2.0.0
        with:
          card: top-langs
          options: layout=compact
          path: assets/cards/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate README.md
        run: |
          pnpm generate
        env:
          # note: GITHUB_TOKEN doesn't seem to work due to permissions
          USER_TOKEN: ${{ secrets.USER_TOKEN }}

      - name: Commit changes if any
        # https://github.com/actions/checkout/pull/1184
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards
          git commit -m "Update README.md and cards" || exit 0
          git push
